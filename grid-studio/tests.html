<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Self-tests</title>
<style>body{font:13px/1.5 ui-monospace,Menlo,monospace;background:#1b1b1b;color:#d6d6d6;padding:16px}
.ok{color:#34c759}.bad{color:#ff3b30;font-weight:700}h1{font:600 16px sans-serif}iframe{position:absolute;left:-9999px;width:1200px;height:800px}</style></head>
<body><h1>Digital Microscope Gridoverlay Studio: self-tests</h1><div id="out">running…</div>
<iframe id="app" src="index.html?nostore"></iframe>   <!-- ?nostore: the tests never read or overwrite a chip list remembered by the real app -->
<!-- Loads the real app in a hidden iframe and checks its maths and behaviour through the app's own globals.
     Open this page the same way as the app (double-click, or http://localhost:8765/tests.html). No libraries. -->
<script>
const frame = document.getElementById('app'), out = document.getElementById('out'), results = [];
const run = (win, code) => win.eval(code);                       // top-level const/let of classic scripts are reachable via eval, not via win.X
const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
function test(name, fn) { try { const r = fn(); results.push([name, r === undefined || r === true, r === false ? 'returned false' : '']); } catch (e) { results.push([name, false, e.message]); } }

frame.onload = () => setTimeout(async () => {
  const w = frame.contentWindow, E = code => run(w, code);
  test('clicking empty #hint upload overlay opens file input before an image is loaded', () => {
    let clicks = 0; const fileIn = w.document.getElementById('file'), orig = fileIn.click;
    fileIn.click = () => { clicks++; };
    try {
      w.document.getElementById('hint').dispatchEvent(new w.MouseEvent('click', {bubbles: true, cancelable: true, button: 0}));
      return clicks === 1 && w.getComputedStyle(w.document.getElementById('hint')).cursor === 'pointer';
    } finally { fileIn.click = orig; }
  });
  E('loadSample()');
  test('clicking #hint does not open file input after an image is loaded', () => {
    let clicks = 0; const fileIn = w.document.getElementById('file'), orig = fileIn.click;
    fileIn.click = () => { clicks++; };
    try {
      w.document.getElementById('hint').dispatchEvent(new w.MouseEvent('click', {bubbles: true, cancelable: true, button: 0}));
      return clicks === 0 && w.document.getElementById('hint').style.display === 'none';
    } finally { fileIn.click = orig; }
  });

  // ---- chip table integrity (catches typos in chips.js) ----
  for (const c of E('CHIPS')) {
    test(`${c.id}: pitch = well + wall`, () => c.pitch === c.well + c.wall);
    // the table rounds well counts down (V10.2: 66 x 120 = 7920 of 8000, V12: 49 x 200 = 9800 of 10000), so allow up to one pitch of slack
    test(`${c.id}: wells x pitch fits the stated array size to within one pitch`, () => c.wide * c.pitch <= c.widthUm + 1e-9 && c.widthUm - c.wide * c.pitch <= c.pitch && c.long * c.pitch <= c.lengthUm + 1e-9 && c.lengthUm - c.long * c.pitch <= c.pitch);
  }

  // ---- true-to-scale grid: drawn well / pitch must equal the table's ratio, for every chip, fit and tiled ----
  for (const fit of [true, false]) for (const c of E('CHIPS')) test(`${c.id}: well/pitch ratio exact (${fit ? 'fit' : 'tiled'})`, () => {
    E(`S.chip.fit = ${fit}; selectChip(null); selectChip('${c.id}')`);
    const L = E('gridLayout(S.doc.w, S.doc.h)'); return near(L.size / L.pitchX, c.well / c.pitch, 1e-9) && L.shape === c.shape;
  });

  // ---- fit mode: equal dead room on left/right and top/bottom, and the canvas hugs the array ----
  E('S.chip.fit = true');
  for (const c of E('CHIPS')) test(`${c.id}: array centred with equal borders`, () => {
    E(`selectChip(null); selectChip('${c.id}')`);
    const L = E('gridLayout(S.doc.w, S.doc.h)'), W = E('S.doc.w'), H = E('S.doc.h');
    const right = W - (L.x0 + (L.i1 - 1) * L.pitchX + L.size), bottom = H - (L.y0 + (L.j1 - 1) * L.pitchY + L.size);
    return near(L.x0, right, 1.5) && near(L.y0, bottom, 1.5) && L.x0 > 0 && L.i1 === c.wide && L.j1 === c.long;
  });
  E('selectChip(null)');
  test('unticking a chip restores the canvas size', () => E('S.doc.w') === 1200 && E('S.doc.h') === 800);

  // ---- image µm/px is preserved when the grid scale changes ----
  test('µm/px stays constant when the grid scale changes (fit toggle)', () => {
    E("selectChip('V3.1')"); const u = E('umPerPx()'); E('setChipFit(false)'); const u2 = E('umPerPx()'); E('setChipFit(true); selectChip(null)'); return near(u, u2, 1e-9);
  });

  // ---- distortion maths ----
  test('warp: untouched = identity', () => !E('warpActive()') && near(E('warpPoint(.3, .7).x'), .3) && near(E('warpPoint(.3, .7).y'), .7));
  test('warp: moving a corner changes it', () => { E('S.warp.c.se = {x: .9, y: .9}'); const a = E('warpActive()'); E('resetWarp()'); return a && !E('warpActive()'); });
  test('warp: side handle moves both corners of its edge (drag simulation)', () => {
    E("S.tool='warp'"); const d = E("dragTypes.warpEdge.start({target:{dataset:{w:'n'}}}, {x:600, y:0})");
    E('dragTypes.warpEdge.move')(d, {}, {x: 600, y: 80});
    const ok = near(E('S.warp.c.nw.y'), 80 / E('S.doc.h'), 1e-9) && near(E('S.warp.c.ne.y'), 80 / E('S.doc.h'), 1e-9); E('resetWarp()'); E("setTool('move')"); return ok;
  });

  // ---- keyboard ----
  const key = (k, o = {}) => w.document.body.dispatchEvent(new w.KeyboardEvent('keydown', {key: k, bubbles: true, cancelable: true, ...o}));
  test('arrow key nudges image 1 px, Shift 10 px', () => { const x = E('S.img.x'); key('ArrowRight'); key('ArrowRight', {shiftKey: true}); return near(E('S.img.x') - x, 11); });
  test('G toggles grid, R resets image', () => { key('g'); const off = !E('S.grid.visible'); key('g'); key('r'); return off && E('S.grid.visible') && E('S.img.x') === 0; });
  test('focused slider takes the arrow key (image does not move)', () => {
    const r = [...w.document.querySelectorAll('.row')].find(r => r.children[0].textContent === 'Strength').children[1]; r.focus();
    const x = E('S.img.x'), k = E('S.lens.k1'); r.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true, cancelable: true})); r.blur();
    return E('S.img.x') === x && near(E('S.lens.k1') - k, .01, 1e-9);
  });

  // ---- export: must contain the image AND the grid (it once exported only the grid) ----
  test('export contains image + grid; image-only has no grid; grid-only has no image', () => {
    E("selectChip(null); S.grid.visible = true; S.grid.mode = 'filled'; S.grid.opacity = 1; S.grid.color = '#ff0000'; S.grid.mode = 'outline'; resetImageTransform(); resetWarp(); S.img.crop = null");
    const pix = o => { const c = E(`buildExportCanvas(${JSON.stringify(o)})`), d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let img = 0, red = 0;
      for (let i = 0; i < d.length; i += 4) { if (d[i + 3] === 255 && !(d[i] > 200 && d[i + 1] < 60)) img++; if (d[i] > 200 && d[i + 1] < 60 && d[i + 2] < 60 && d[i + 3] > 200) red++; } return {img, red}; };
    const both = pix({image: true, grid: true}), onlyImg = pix({image: true, grid: false}), onlyGrid = pix({image: false, grid: true});
    return both.img > 100000 && both.red > 100 && onlyImg.red === 0 && onlyImg.img > 100000 && onlyGrid.img === 0 && onlyGrid.red > 100;
  });
  test('grid line width: slider value on a 1200 px canvas, scaled up on bigger canvases', () => {
    const w = E('S.grid.stroke'); return near(E('gridLineWidth(1200)'), w) && near(E('gridLineWidth(2400)'), 2 * w) && near(E('gridLineWidth(600)'), w) && w === 2;
  });
  test('drawGrid paints over existing pixels instead of clearing them', () => {
    const c = w.document.createElement('canvas'); c.width = 400; c.height = 400; const x = c.getContext('2d'); x.fillStyle = '#00ff00'; x.fillRect(0, 0, 400, 400);
    E('S.grid.visible = true'); E('drawGrid')(x, 400, 400, 1); const d = x.getImageData(0, 0, 400, 400).data; let green = 0; for (let i = 0; i < d.length; i += 4) if (d[i] === 0 && d[i + 1] === 255 && d[i + 2] === 0) green++; return green > 20000;
  });

  // ---- chip list file, validation & import (chips.js + js/chiplist.js) ----
  E("useBuiltinChipList()");                                       // (the app runs with ?nostore here: no remembered list is read, written or deleted)
  const nBuiltin = E('BUILTIN_CHIPS.length');
  test(`built-in chips.js is the list the app starts on (${nBuiltin} versions)`, () => {
    return E('Array.isArray(BUILTIN_CHIPS) && BUILTIN_CHIPS.length > 0 && CHIPS.length === BUILTIN_CHIPS.length && CHIP_STORE_OFF') &&
      new RegExp(`chips\\.js.*\\(${nBuiltin} versions?\\)`).test(E("$('#chipSource').textContent")) &&
      E("$('#chipBuiltin').disabled") === true;
  });
  test('validateChips accepts a good chip, normalises string numbers, and fills defaults', () => {
    const r = E(`validateChips([{id: 'V-Test', shape: 'Circle', pitch: '120', well: '80', wide: '50', long: '40'}])`);
    const c = r.chips[0];
    return r.errors.length === 0 && r.chips.length === 1 && c.id === 'V-Test' && c.shape === 'circle' &&
      c.pitch === 120 && c.well === 80 && c.wall === 40 && c.wide === 50 && c.long === 40 &&
      c.widthUm === 6000 && c.lengthUm === 4800 && c.draft === null;
  });
  test('validateChips rejects well > pitch, wall mismatch, duplicate id, and non-integer wells with plain messages', () => {
    const r = E(`validateChips([
      {id: 'V-BigWell', pitch: 120, well: 130, wide: 10, long: 10},
      {id: 'V-BadWall', pitch: 120, well: 80, wall: 30, wide: 10, long: 10},
      {id: 'V-Ok', pitch: 100, well: 60, wide: 10, long: 10},
      {id: 'V-Ok', pitch: 100, well: 60, wide: 10, long: 10},
      {id: 'V-Frac', pitch: 100, well: 60, wide: 10.5, long: 10}
    ])`);
    return r.chips.length === 1 && r.chips[0].id === 'V-Ok' && r.errors.length === 4 &&
      r.errors.some(m => /V-BigWell/.test(m) && /130/.test(m) && /120/.test(m)) &&
      r.errors.some(m => /V-BadWall/.test(m) && /wall/i.test(m)) &&
      r.errors.some(m => /V-Ok/.test(m) && /duplicate/i.test(m)) &&
      r.errors.some(m => /V-Frac/.test(m) && /whole number/i.test(m));
  });
  test('parseChipFile parses JSON (array and {chips}) and spreadsheet CSV headers (with quoted fields and ignored cm columns)', () => {
    const j1 = E(`parseChipFile('[{"id":"J1","pitch":100,"well":60,"wide":20,"long":20}]', 'chips.json')`);
    const j2 = E(`parseChipFile('{"chips":[{"id":"J2","pitch":150,"well":100,"wide":30,"long":30}]}', 'chips.json')`);
    const csv = [
      'Chip Version,Shape,Bottom,Draft Angle,Nominal Pitch,Well size,Top Wall Width,Depth,Array width (cm),Array length (cm),Array width (um),Array length (um),# wells wide,# wells long',
      'V16-New,Round,"radius 20 µm, polished",5,150,110,40,200,0.9,0.6,9000,6000,60,40'
    ].join('\n');
    const cList = E(`parseChipFile(${JSON.stringify(csv)}, 'lab-sheet.csv')`);
    const v = E(`validateChips(${JSON.stringify(cList)})`).chips[0];
    let badErr = '';
    try { E(`parseChipFile('colA,colB\\n1,2', 'bad.csv')`); } catch (e) { badErr = e.message; }
    return j1.length === 1 && j1[0].id === 'J1' && j2.length === 1 && j2[0].id === 'J2' &&
      v && v.id === 'V16-New' && v.shape === 'circle' && v.bottom === 'radius 20 µm, polished' &&
      v.pitch === 150 && v.well === 110 && v.wall === 40 && v.widthUm === 9000 && v.lengthUm === 6000 &&
      v.wide === 60 && v.long === 40 && /required column/i.test(badErr);
  });
  test('setChipList mutates CHIPS in place, ticks and draws a new chip to scale, unticks a removed chip, and refuses an all-invalid list', () => {
    E('window.__chipsRef = CHIPS');
    const r1 = E(`setChipList([{id: 'V-Custom', shape: 'square', pitch: 160, well: 120, wide: 25, long: 20}], 'loaded from custom.json')`);
    E("selectChip('V-Custom')");
    const L = E('gridLayout(S.doc.w, S.doc.h)');
    const ratioOk = near(L.size / L.pitchX, 120 / 160, 1e-9) && E('S.chip.id') === 'V-Custom';
    const rBad = E(`setChipList([{id: 'Broken', pitch: 50, well: 90, wide: 10, long: 10}], 'loaded from bad.json')`);
    const keptOld = rBad.count === 0 && E('CHIPS.length') === 1 && E('CHIPS[0].id') === 'V-Custom' && E('S.chip.id') === 'V-Custom';
    const r2 = E(`setChipList([{id: 'V-Other', shape: 'circle', pitch: 100, well: 70, wide: 20, long: 20}], 'loaded from other.json')`);
    const unticked = r2.count === 1 && E('S.chip.id') === null;
    const sameRef = E('window.__chipsRef === CHIPS');
    return r1.count === 1 && ratioOk && keptOld && unticked && sameRef;
  });
  test('HTML in a chip id is escaped in the panel and chip info box', () => {
    E(`setChipList([{id: '<img src=x onerror="window.__xss=1">', pitch: 100, well: 60, wide: 10, long: 10}], 'loaded from xss.json')`);
    E(`selectChip('<img src=x onerror="window.__xss=1">')`);
    const noImg = E("$('#chipList').querySelectorAll('img').length === 0 && $('#chipInfo').querySelectorAll('img').length === 0 && !window.__xss");
    const restored = E("useBuiltinChipList(); selectChip(null); resetImageTransform(); CHIPS.length === BUILTIN_CHIPS.length");
    return noImg && restored;
  });
  test('chip files from real spreadsheets: µ in headers, decimal commas, thousands separators; a well as wide as the pitch and absurd well counts are refused', () => {
    const mu = E(`validateChips(parseChipFile(${JSON.stringify('Chip Version,Nominal Pitch (µm),Well size (μm),Top Wall Width (µm),Array width (µm),Array length (um),# wells wide,# wells long\nM1,120,80,40,"19,500",9500,83,83')}, 'mu.csv'))`);
    const semi = E(`validateChips(parseChipFile(${JSON.stringify('Chip Version;Nominal Pitch;Well size;# wells wide;# wells long\nS1;120,5;80,5;10;10')}, 'semi.csv'))`);
    const bad = E(`validateChips([{id: 'NoWall', pitch: 100, well: 100, wide: 10, long: 10}, {id: 'Huge', pitch: 100, well: 60, wide: 1000, long: 1000}, {id: 'A\\r\\nB', pitch: 100, well: 60, wide: 10, long: 10}])`);
    const m = mu.chips[0], s1 = semi.chips[0];
    return mu.errors.length === 0 && m && m.pitch === 120 && m.well === 80 && m.wall === 40 && m.widthUm === 19500 && m.lengthUm === 9500 &&
      semi.errors.length === 0 && s1 && s1.pitch === 120.5 && s1.well === 80.5 &&
      bad.chips.length === 1 && bad.chips[0].id === 'A B' && bad.errors.some(e => /NoWall/.test(e) && /smaller than the pitch/.test(e)) && bad.errors.some(e => /Huge/.test(e) && /more than the app can draw/.test(e));
  });
  test('loading a chip list keeps the image calibration (µm per pixel) when the ticked chip\'s numbers change', () => {
    E("selectChip('V12')"); const u0 = E('umPerPx()');
    E("setChipList(BUILTIN_CHIPS.map(c => c.id === 'V12' ? {...c, pitch: 250, well: 220, wall: 30} : c), 'loaded from changed.json')"); const u1 = E('umPerPx()'), still = E('S.chip.id') === 'V12';
    E('useBuiltinChipList(); selectChip(null); resetImageTransform()');
    return still && u0 > 0 && near(u1, u0, 1e-9) && E('CHIPS.length === BUILTIN_CHIPS.length');
  });

  // ---- portable settings files + image names (restore everything before the crop tests below) ----
  {
    const original = E('settingsSnapshot()'), originalImage = E('S.img.el');
    const transient = E('({crop:S.crop, tool:S.tool, zoom:S.zoom, undo:undoStack.slice(), af:afUndoState, waiting:waitingSettings, source:settingsSource, info:$("#settingsInfo").textContent})');
    const normal = s => JSON.stringify(s, (k, v) => k === 'savedAt' ? undefined : v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(k => [k, v[k]])) : v);
    const copy = s => JSON.parse(JSON.stringify(s));
    const pixels = canvas => ({w: canvas.width, h: canvas.height, d: canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data});
    const samePixels = (a, b) => a.w === b.w && a.h === b.h && a.d.every((v, k) => v === b.d[k]);
    const configure = `selectChip('V12'); setChipFit(true); setChipMargin(12);
      Object.assign(S.doc, {w:480, h:360});
      Object.assign(S.img, {name:'alignment-photo.tiff', x:23.5, y:-16.25, scale:1.17, rot:13.2, crop:{x:60,y:40,w:900,h:600,rot:-13.2}});
      Object.assign(S.lens, {k1:.12,k2:-.03,cx:.47,cy:.52,bypass:false});
      Object.assign(S.warp, defaultWarp()); S.warp.c.nw.x=.02; S.warp.c.se.y=.96; S.warp.dev.n.y=.01; S.warp.dev.e.x=-.013;
      S.warp.mesh={n:17,d:Array.from({length:578},(_,k)=>.002*Math.sin(k*.37))};
      Object.assign(S.grid, {visible:true,mode:'filled',color:'#34c759',opacity:.43,shape:'circle',size:17,gapX:9,gapY:13,mL:12,mR:24,mT:15,mB:20,center:false,offX:3,offY:-4,cols:8,rows:6,radius:3,stroke:1.25});
      S.chip.arrayOnly=true; S.ratio=4/3; $('#exImg').checked=true; $('#exGrid').checked=true;
      refresh('gl','grid','layout','crop','warp','status');`;
    try {
      E(configure);
      const good = E('settingsSnapshot()'), beforePixels = pixels(E('buildExportCanvas()'));
      test('settings snapshot is detached data with no pixels, view, tools or undo history', () => {
        const s = E('settingsSnapshot()'); s.warp.c.nw.x = 9; s.chip.definition.well = 1;
        return s.kind === 'grid-studio-settings' && s.version === 1 && s.image.name === 'alignment-photo.tiff' && !('el' in s.img) && !('zoom' in s) && !('tool' in s) && !('undoStack' in s) && E('S.warp.c.nw.x') === .02 && E('activePreset().well') !== 1;
      });
      test('settings save → change many settings → load restores state, object identities and export pixels exactly', () => {
        const refs = E('[S.img,S.lens,S.warp,S.grid,S.chip]');
        E(`selectChip(null); setChipFit(false); resetImageTransform(); resetLens(); resetWarp();
          S.img.crop=null; S.ratio=0; S.doc.w=600; S.doc.h=400; S.grid.mode='outline'; S.grid.color='#ffffff'; S.grid.opacity=1; S.grid.offX=90;
          $('#exImg').checked=false; $('#exGrid').checked=false; undoStack.push({crop:null}); afUndoState=afSnapshot();`);
        const parsed = E('parseSettings')(E('settingsToText')(good)).settings, r = E('applySettings')(parsed);
        const after = E('settingsSnapshot()'), newRefs = E('[S.img,S.lens,S.warp,S.grid,S.chip]');
        return r.ok && !r.warnings.length && normal(good) === normal(after) && refs.every((v,k)=>v===newRefs[k]) &&
          samePixels(beforePixels, pixels(E('buildExportCanvas()'))) && beforePixels.d.some((v,k)=>k%4===3 && v>0) && E('undoStack.length===0 && afUndoState===null && S.crop===null') &&
          E(`$('#gMode').value==='filled' && $('#gShape').value==='circle' && $('#cRatio').value===String(4/3) && $('#exArray').checked && $('#afUndo').disabled`);
      });
      test('settings before image and image before settings end in the same state; waiting file is used once', () => {
        E('Object.assign(S.img,{el:null,name:"",w:0,h:0})');
        const r = E('applySettings')(good), waits = E('waitingSettings!==null') && /Now open alignment-photo.tiff/.test(E('$("#settingsInfo").textContent'));
        E('setImage')(originalImage, good.image.name);
        const first = E('settingsSnapshot()'), used = E('waitingSettings===null');
        E('setImage')(originalImage, good.image.name); const reset = E('S.img.rot===0 && S.img.crop===null');
        E('applySettings')(good);
        return r.ok && waits && used && reset && normal(first) === normal(E('settingsSnapshot()')) && normal(first) === normal(good);
      });
      const invalid = [
        ['broken JSON', null, /complete JSON/i], ['wrong kind', s=>s.kind='other-app', /not a Grid Studio/i],
        ['newer version', s=>s.version=2, /newer version of the studio/i], ['NaN', s=>s.lens.k1=NaN, /finite number/i],
        ['out-of-range lens', s=>s.lens.k1=9, /between/i], ['wrong mesh length', s=>s.warp.mesh.d.pop(), /wrong number of points/i],
        ['number as text', s=>s.img.scale='1.2', /finite number/i], ['boolean as number', s=>s.chip.fit=1, /true or false/i],
        ['bad colour', s=>s.grid.color='red', /hex colour/i], ['unknown choice', s=>s.grid.mode='dots', /recognised choice/i],
        ['zero crop', s=>s.img.crop.w=0, /greater than zero/i], ['oversized mesh', s=>s.warp.mesh.n=1000, /between/i],
      ];
      for (const [name, change, message] of invalid) test(`settings refuse ${name} with a plain message and no state change`, () => {
        const before = normal(E('settingsSnapshot()')), refs = E('[S.img,S.lens,S.warp,S.grid,S.chip]'), s = copy(good);
        let reason = '';
        if (!change) { try { E('parseSettings')('{broken'); } catch(e) { reason=e.message; } }
        else { change(s); const r = E('applySettings')(s); if (!r.ok) reason=r.reason; }
        return message.test(reason) && normal(E('settingsSnapshot()')) === before && refs.every((v,k)=>v===E('[S.img,S.lens,S.warp,S.grid,S.chip]')[k]);
      });
      test('settings parse rejects non-finite JSON numbers before applying anything', () => {
        const text = E('settingsToText')(good).replace('"k1": 0.12', '"k1": 1e999'), before=normal(E('settingsSnapshot()'));
        let reason=''; try { E('parseSettings')(text); } catch(e) { reason=e.message; }
        return /finite number/.test(reason) && normal(E('settingsSnapshot()'))===before;
      });
      test('settings refuse a missing chip and explain how to load its list first', () => {
        const s=copy(good), before=normal(E('settingsSnapshot()')); s.chip.id=s.chip.definition.id='Missing version';
        const r=E('applySettings')(s);
        return !r.ok && /Missing version/.test(r.reason) && /Load chip list…/.test(r.reason) && normal(E('settingsSnapshot()'))===before;
      });
      test('settings warn when a known chip has different drawing measurements', () => {
        const s=copy(good); s.chip.definition.well-=1; s.chip.definition.wall+=1;
        const r=E('applySettings')(s); return r.ok && r.warnings.some(m=>/different well or array measurements/.test(m));
      });
      test('settings warn clearly about a different image size, and mildly about a different name', () => {
        const s=copy(good); s.image.width+=1; const size=E('applySettings')(s);
        s.image.width=good.image.width; s.image.name='other.tiff'; const name=E('applySettings')(s);
        return size.ok && size.warnings.some(m=>/different-sized picture/.test(m)) && name.ok && name.warnings.some(m=>/file name is different/.test(m));
      });
      test('settings ignore unknown keys at every level and clamp canvas and dead room as the app does', () => {
        const s=copy(good); s.extra={x:1}; s.img.extra=99; s.lens.extra='unused'; s.warp.c.nw.extra=1; s.chip.definition.extra=1;

            const xEdge = (pu < .08 || pu > .92) ? 24 * (xSign >= 0 ? 1 : -1) : 0;
            const yEdge = (pv < .08 || pv > .92) ? -20 : 0;
            const haze = 1 - .85 * Math.exp(-((nu - .55) ** 2 + (nv - .5) ** 2) / .18);
            lum = 78 + haze * (xEdge + yEdge) + 20 * xSign * Math.cos(2 * Math.PI * pu) + 22 * Math.cos(Math.PI * nv) * Math.sin(2 * Math.PI * pv) - 10 * Math.cos(2 * Math.PI * pv);
          }
          const val = clamp(Math.round(lum + (rand() - .5) * 22), 0, 255), ti = (yy * W + xx) * 4;

        const toSrc = (u, v) => {
          const dx = u - aw / 2, dy = v - ah / 2, sx = cs * dx - sn * dy, sy = sn * dx + cs * dy, rm = Math.hypot(sx, sy) / R;
          let r = rm; for (let k = 0; k < 8; k++) r -= (r * (1 + barrel * r * r) - rm) / (1 + 3 * barrel * r * r);

        const corners = [[0, 0], [aw, 0], [aw, ah], [0, ah]].map(([u, v]) => toSrc(u, v));
        setImage(out); selectChip(null); selectChip('V12'); resetLens(); resetWarp();
        const L = gridLayout(S.doc.w, S.doc.h), gw = P.wide * L.pitchX - (L.pitchX - L.size), gh = P.long * L.pitchY - (L.pitchY - L.size);
        const gc = [[L.x0, L.y0], [L.x0 + gw, L.y0], [L.x0 + gw, L.y0 + gh], [L.x0, L.y0 + gh]];
        const errNow = () => {
          const fw = afForward(afCurrent(), {w: S.img.w, h: S.img.h, cx: S.lens.cx, cy: S.lens.cy, docW: S.doc.w, docH: S.doc.h, mesh: S.warp.mesh}), o = [0, 0, 0, 0];
          return Math.max(...corners.map((c, i) => { fw(c.x, c.y, o); return Math.hypot(o[0] - gc[i][0], o[1] - gc[i][1]) / L.pitchX; }));
        };
        const rFull = autoFitNow(false), fullErr = rFull.ok ? errNow() : Infinity, fullK1 = S.lens.k1;
        resetLens(); resetImageTransform(); resetWarp();
        const rCorner = autoFitFromCorners(corners, false), cornerErr = rCorner.ok ? errNow() : Infinity, cornerK1 = S.lens.k1;
        return {fullOk: rFull.ok, fullErr, fullK1, cornerRefined: !!rCorner.stats?.refined, cornerErr, cornerK1};
      })()`);
      test(`auto-fit + four corners with pincushion bend and opposite X/Y shading polarity (full ${r.fullErr.toFixed(3)} pitch, k1 ${r.fullK1.toFixed(3)}; corners ${r.cornerErr.toFixed(3)} pitch, refined=${r.cornerRefined})`,
        () => r.fullOk && r.fullErr < .25 && r.fullK1 < -.02 && r.cornerRefined && r.cornerErr < .25 && r.cornerK1 < -.02);
    } finally { f.remove(); }
  }

  const bad = results.filter(r => !r[1]);
  out.innerHTML = `<p class="${bad.length ? 'bad' : 'ok'}">${results.length - bad.length} / ${results.length} passed</p>` +
    results.map(([n, ok, msg]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'}  ${n} ${msg}</div>`).join('');
  document.title = bad.length ? `FAIL (${bad.length})` : 'PASS';
