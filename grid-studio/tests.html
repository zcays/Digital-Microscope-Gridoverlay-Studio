<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Self-tests</title>
<style>body{font:13px/1.5 ui-monospace,Menlo,monospace;background:#1b1b1b;color:#d6d6d6;padding:16px}
.ok{color:#34c759}.bad{color:#ff3b30;font-weight:700}h1{font:600 16px sans-serif}iframe{position:absolute;left:-9999px;width:1200px;height:800px}</style></head>
<body><h1>Digital Microscope Gridoverlay Studio: self-tests</h1><div id="out">running…</div>
<iframe id="app" src="index.html"></iframe>
<!-- Loads the real app in a hidden iframe and checks its maths and behaviour through the app's own globals.
     Open this page the same way as the app (double-click, or http://localhost:8765/tests.html). No libraries. -->
<script>
const frame = document.getElementById('app'), out = document.getElementById('out'), results = [];
const run = (win, code) => win.eval(code);                       // top-level const/let of classic scripts are reachable via eval, not via win.X
const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
function test(name, fn) { try { const r = fn(); results.push([name, r === undefined || r === true, r === false ? 'returned false' : '']); } catch (e) { results.push([name, false, e.message]); } }

frame.onload = () => setTimeout(() => {
  const w = frame.contentWindow, E = code => run(w, code);
  E('loadSample()');

  // ---- chip table integrity (catches typos in presets.js) ----
  for (const c of E('CHIPS')) {
    test(`${c.id}: pitch = well + wall`, () => c.pitch === c.well + c.wall);
    // the table rounds well counts down (V10.2: 66 x 120 = 7920 of 8000, V12: 49 x 200 = 9800 of 10000), so allow up to one pitch of slack
    test(`${c.id}: wells x pitch fits the stated array size to within one pitch`, () => c.wide * c.pitch <= c.widthUm + 1e-9 && c.widthUm - c.wide * c.pitch <= c.pitch && c.long * c.pitch <= c.lengthUm + 1e-9 && c.lengthUm - c.long * c.pitch <= c.pitch);
  }

  // ---- true-to-scale grid: drawn well / pitch must equal the table's ratio, for every chip, fit and tiled ----
  for (const fit of [true, false]) for (const c of E('CHIPS')) test(`${c.id}: well/pitch ratio exact (${fit ? 'fit' : 'tiled'})`, () => {
    E(`S.chip.fit = ${fit}; selectChip(null); selectChip('${c.id}')`);
    const L = E('gridLayout(S.doc.w, S.doc.h)'); return near(L.size / L.pitchX, c.well / c.pitch, 1e-9) && L.shape === c.shape;
  });

  // ---- fit mode: equal dead room on left/right and top/bottom, and the canvas hugs the array ----
  E('S.chip.fit = true');
  for (const c of E('CHIPS')) test(`${c.id}: array centred with equal borders`, () => {
    E(`selectChip(null); selectChip('${c.id}')`);
    const L = E('gridLayout(S.doc.w, S.doc.h)'), W = E('S.doc.w'), H = E('S.doc.h');
    const right = W - (L.x0 + (L.i1 - 1) * L.pitchX + L.size), bottom = H - (L.y0 + (L.j1 - 1) * L.pitchY + L.size);
    return near(L.x0, right, 1.5) && near(L.y0, bottom, 1.5) && L.x0 > 0 && L.i1 === c.wide && L.j1 === c.long;
  });
  E('selectChip(null)');
  test('unticking a chip restores the canvas size', () => E('S.doc.w') === 1200 && E('S.doc.h') === 800);

  // ---- image µm/px is preserved when the grid scale changes ----
  test('µm/px stays constant when grid zoom changes', () => {
    E("selectChip('V3.1')"); const u = E('umPerPx()'); E('setChipZoom(250)'); const u2 = E('umPerPx()'); E('selectChip(null)'); return near(u, u2, 1e-9);
  });

  // ---- distortion maths ----
  test('warp: untouched = identity', () => !E('warpActive()') && near(E('warpPoint(.3, .7).x'), .3) && near(E('warpPoint(.3, .7).y'), .7));
  test('warp: moving a corner changes it', () => { E('S.warp.c.se = {x: .9, y: .9}'); const a = E('warpActive()'); E('resetWarp()'); return a && !E('warpActive()'); });
  test('warp: side handle moves both corners of its edge (drag simulation)', () => {
    E("S.tool='warp'"); const d = E("dragTypes.warpEdge.start({target:{dataset:{w:'n'}}}, {x:600, y:0})");
    E('dragTypes.warpEdge.move')(d, {}, {x: 600, y: 80});
    const ok = near(E('S.warp.c.nw.y'), 80 / E('S.doc.h'), 1e-9) && near(E('S.warp.c.ne.y'), 80 / E('S.doc.h'), 1e-9); E('resetWarp()'); E("setTool('move')"); return ok;
  });

  // ---- keyboard ----
  const key = (k, o = {}) => w.document.body.dispatchEvent(new w.KeyboardEvent('keydown', {key: k, bubbles: true, cancelable: true, ...o}));
  test('arrow key nudges image 1 px, Shift 10 px', () => { const x = E('S.img.x'); key('ArrowRight'); key('ArrowRight', {shiftKey: true}); return near(E('S.img.x') - x, 11); });
  test('G toggles grid, R resets image', () => { key('g'); const off = !E('S.grid.visible'); key('g'); key('r'); return off && E('S.grid.visible') && E('S.img.x') === 0; });
  test('focused slider takes the arrow key (image does not move)', () => {
    const r = [...w.document.querySelectorAll('.row')].find(r => r.children[0].textContent === 'Strength').children[1]; r.focus();
    const x = E('S.img.x'), k = E('S.lens.k1'); r.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true, cancelable: true})); r.blur();
    return E('S.img.x') === x && near(E('S.lens.k1') - k, .01, 1e-9);
  });

  // ---- export: must contain the image AND the grid (it once exported only the grid) ----
  test('export contains image + grid; image-only has no grid; grid-only has no image', () => {
    E("selectChip(null); S.grid.visible = true; S.grid.mode = 'filled'; S.grid.opacity = 1; S.grid.color = '#ff0000'; S.grid.mode = 'outline'; resetImageTransform(); resetWarp(); S.img.crop = null");
    const pix = o => { const c = E(`buildExportCanvas(${JSON.stringify(o)})`), d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let img = 0, red = 0;
      for (let i = 0; i < d.length; i += 4) { if (d[i + 3] === 255 && !(d[i] > 200 && d[i + 1] < 60)) img++; if (d[i] > 200 && d[i + 1] < 60 && d[i + 2] < 60 && d[i + 3] > 200) red++; } return {img, red}; };
    const both = pix({image: true, grid: true}), onlyImg = pix({image: true, grid: false}), onlyGrid = pix({image: false, grid: true});
    return both.img > 100000 && both.red > 100 && onlyImg.red === 0 && onlyImg.img > 100000 && onlyGrid.img === 0 && onlyGrid.red > 100;
  });
  test('grid line width: slider value on a 1200 px canvas, scaled up on bigger canvases', () => {
    const w = E('S.grid.stroke'); return near(E('gridLineWidth(1200)'), w) && near(E('gridLineWidth(2400)'), 2 * w) && near(E('gridLineWidth(600)'), w) && w === 2;
  });
  test('drawGrid paints over existing pixels instead of clearing them', () => {
    const c = w.document.createElement('canvas'); c.width = 400; c.height = 400; const x = c.getContext('2d'); x.fillStyle = '#00ff00'; x.fillRect(0, 0, 400, 400);
    E('S.grid.visible = true'); E('drawGrid')(x, 400, 400, 1); const d = x.getImageData(0, 0, 400, 400).data; let green = 0; for (let i = 0; i < d.length; i += 4) if (d[i] === 0 && d[i + 1] === 255 && d[i + 2] === 0) green++; return green > 20000;
  });

  // ---- crop ----
  test('crop only masks the image: canvas and grid are unchanged, undo/reset restore it', () => {
    const grid0 = JSON.stringify(E('gridLayout(S.doc.w, S.doc.h)')), doc0 = E('[S.doc.w, S.doc.h]').join('x');
    E("setTool('crop'); S.crop = {x: 100, y: 100, w: 600, h: 400}; applyCrop()");
    const c = E('S.img.crop');
    const masked = c && near(c.x, 100) && near(c.y, 100) && near(c.w, 600) && near(c.h, 400);      // image at scale 1, no rotation → same numbers
    const same = JSON.stringify(E('gridLayout(S.doc.w, S.doc.h)')) === grid0 && E('[S.doc.w, S.doc.h]').join('x') === doc0;
    E('undoCrop()'); const undone = E('S.img.crop') === null;
    E("S.crop = {x: 0, y: 0, w: 300, h: 300}; applyCrop(); resetCrop()"); const reset = E('S.img.crop') === null;
    return masked && same && undone && reset;
  });
  test('crop rect maps through image scale and position', () => {
    E('S.img.scale = 2; S.img.x = 50; S.img.y = 20'); const r = E('canvasRectToImageRect({x: 250, y: 120, w: 400, h: 200})');
    E('resetImageTransform()'); return near(r.x, 100) && near(r.y, 50) && near(r.w, 200) && near(r.h, 100);
  });

  const bad = results.filter(r => !r[1]);
  out.innerHTML = `<p class="${bad.length ? 'bad' : 'ok'}">${results.length - bad.length} / ${results.length} passed</p>` +
    results.map(([n, ok, msg]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'}  ${n} ${msg}</div>`).join('');
  document.title = bad.length ? `FAIL (${bad.length})` : 'PASS';
}, 600);
</script></body></html>
