<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sugar Pebbles Geometry Tests</title>
</head>
<body>
  <h1>Sugar Pebbles Geometry Tests</h1>
  <pre id="results">Running…</pre>
  <script src="js/state.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/wells.js"></script>
  <script src="js/seg.js"></script>
  <script>
  'use strict';

  const results = [];
  let failureCount = 0;

  function assertEqual(actual, expected) {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
      throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }
  }

  function test(name, run) {
    try {
      run();
      results.push(`PASS ${name}`);
    } catch (error) {
      failureCount++;
      results.push(`FAIL ${name} — ${error.message}`);
    }
  }

  function wellsFromCsv(lines) {
    const dataset = parseTableSync(lines.join('\n'));
    const rows = Int32Array.from({ length: dataset.rowCount }, (_, index) => index);
    return buildChipWells(dataset, rows, 'test', null);
  }

  test('Sparse explicit grid preserves observed IDs and gives synthetic wells distinct IDs', () => {
    const wells = wellsFromCsv([
      'cell_id,x,y,id,arr-row,arr-col',
      'a,10,30,1,0,0',
      'b,10,10,3,2,0',
      'c,,,4,,',
      'd,,,1,,',
      'e,,,,2,0',
    ]);
    assertEqual(wells.mode, 'explicit');
    assertEqual(wells.wellIds[0], '1');
    assertEqual(wells.wellIds[2], '3');
    assertEqual(wells.wellIds.map(id => wells.wellIdToIdx.get(id)), [0, 1, 2]);
    assertEqual(wells.wellIdToIdx.has('4'), false);
    assertEqual(Array.from(wells.cellWellIdx), [0, 2, -1, 0, 2]);
    assertEqual(Array.from(wells.wellCellCount), [2, 0, 2]);
  });

  test('Derived grid leaves missing XY unassigned and ignores source IDs for geometric bins', () => {
    const wells = wellsFromCsv([
      'cell_id,x,y,id',
      'a,10,10,',
      'b,,10,0',
      'c,10,,',
      'd,,,',
      'e,20,20,',
    ]);
    assertEqual(wells.mode, 'derived');
    const expected = [wells.spatial.closest(10, 10), -1, -1, -1, wells.spatial.closest(20, 20)];
    assertEqual(Array.from(wells.cellWellIdx), expected);
    assertEqual(wells.wellCellCount.reduce((sum, count) => sum + count, 0), 2);
    assertEqual(wells.cellSpatial.closest(20, 20), 4);
  });

  test('Anisotropic 3×2 layout keeps all columns and their 4-connected neighborhoods', () => {
    const wells = wellsFromCsv([
      'cell_id,x,y,id,arr-center_x,arr-center_y',
      'a,1,1,10,0,0',
      'b,11,1,11,10,0',
      'c,21,1,12,20,0',
      'd,1,-99,13,0,-100',
      'e,11,-99,14,10,-100',
      'f,21,-99,15,20,-100',
    ]);
    assertEqual([wells.nCols, wells.nRows, wells.pitchX, wells.pitchY], [3, 2, 10, 100]);
    assertEqual(Array.from(wells.gridToWell), [0, 1, 2, 3, 4, 5]);
    const clicked = wells.spatial.closest(0, 0);
    assertEqual(clicked, 0);
    assertEqual(getBrushWells(wells, clicked, 3), [0, 1, 3, 4]);
    const chip = createChipSegState(wells);
    const barrier = createRoi(chip, 'Barrier', '#ff0000', false);
    applyWellAssignments(chip, [1, 4], barrier.id);
    const target = createRoi(chip, 'Target', '#00ff00', false);
    assertEqual(runFloodAction(chip, clicked, 'flood_fill'), 2);
    assertEqual(Array.from(chip.wellRoi), [target.id, barrier.id, 0, target.id, barrier.id, 0]);
  });

  test('Brush and flood use the clicked well when inferred slots overlap', () => {
    const wells = wellsFromCsv([
      'cell_id,x,y,id',
      'a,0,20,A',
      'b,0.25,20,B',
      'c,10,20,C',
      'd,20,20,D',
    ]);
    const clicked = wells.spatial.closest(0, 20);
    assertEqual(clicked, 0);
    assertEqual(wells.col[0], wells.col[1]);
    assertEqual(getBrushWells(wells, clicked, 3).includes(clicked), true);
    const chip = createChipSegState(wells);
    const original = createRoi(chip, 'Original', '#ff0000', false);
    const other = createRoi(chip, 'Other', '#0000ff', false);
    applyWellAssignments(chip, [0, 2], original.id);
    applyWellAssignments(chip, [1], other.id);
    assertEqual(runFloodAction(chip, clicked, 'flood_erase'), 2);
    assertEqual(Array.from(chip.wellRoi), [0, other.id, 0, 0]);
  });

  document.getElementById('results').textContent = results.join('\n');
  document.title = failureCount ? `FAIL (${failureCount})` : 'PASS';
  </script>
</body>
</html>
